<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skener EAN kódů</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<style>
:root{
  color-scheme: light;
  --bg:#E7EDF0; --panel:#FFFFFF; --ink:#12303F; --ink-soft:#4F6875;
  --line:#C5D2D9; --line-soft:#DCE5EA; --accent:#0A5D8F; --danger:#B3261E;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1A21; --panel:#15252E; --ink:#E7F0F4; --ink-soft:#9DB2BD;
    --line:#2C4350; --line-soft:#223641; --accent:#6CC0EE; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1A21; --panel:#15252E; --ink:#E7F0F4; --ink-soft:#9DB2BD;
  --line:#2C4350; --line-soft:#223641; --accent:#6CC0EE; --danger:#FF8A80;
}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
h1{margin:0 0 2px;font-size:1.15rem;font-weight:800;letter-spacing:.01em}
.sub{margin:0;color:var(--ink-soft);font-size:.88rem}
main{flex:1;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 110px);max-width:640px;width:100%;margin:0 auto}
.count{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.count b{font-size:1.4rem}
.count span{color:var(--ink-soft);font-size:.9rem}
.empty{color:var(--ink-soft);text-align:center;padding:40px 16px;font-size:.95rem}
ul.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
li.row .idx{color:var(--ink-soft);font-size:.8rem;min-width:1.6em;text-align:right}
li.row .code{flex:1;font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:.02em;word-break:break-all}
li.row button.del{border:none;background:transparent;color:var(--danger);width:34px;height:34px;border-radius:8px;font-size:1.1rem;cursor:pointer}
li.row button.del:active{background:var(--line-soft)}
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:11px;padding:14px 10px;font-family:inherit;font-weight:700;font-size:.98rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--qty,var(--line-soft));color:var(--ink);border:1px solid var(--line)}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.btn svg{width:19px;height:19px;flex:none}
.notice{margin:0 0 12px;padding:10px 12px;border-radius:9px;background:var(--qty,var(--line-soft));color:var(--ink);font-size:.9rem}
.notice[hidden]{display:none}
.notice.error{background:#FBE7E5;color:#7A271A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notice.error{background:#3A1E1B;color:#FFB4A9} }
:root[data-theme="dark"] .notice.error{background:#3A1E1B;color:#FFB4A9}

/* ---------- skener ---------- */
.scanner{position:fixed;inset:0;z-index:50;background:#0A1216;display:flex;flex-direction:column}
.scanner[hidden]{display:none}
.scanner-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
.scanner-label{color:#EAF2F6;font-weight:650;font-size:1.05rem}
.scanner-actions{display:flex;gap:8px}
.scanner-iconbtn{width:44px;height:44px;border-radius:9px;border:1.5px solid rgba(234,242,246,.35);background:transparent;color:#EAF2F6;display:flex;align-items:center;justify-content:center;cursor:pointer}
.scanner-iconbtn[aria-pressed="true"]{background:#EAF2F6;color:#0A1216;border-color:#EAF2F6}
.scanner-iconbtn[hidden]{display:none}
.scanner-iconbtn svg{width:22px;height:22px}
.scanner-view{flex:1;min-height:0;position:relative;overflow:hidden}
.scanner-view video{width:100%;height:100%;object-fit:cover}
.scanner-msg{margin:0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;color:#EAF2F6;font-size:.98rem;min-height:1.4em}
.scanner-lastcode{margin:0;padding:0 16px 10px;text-align:center;color:#8FE3A6;font-weight:700;font-size:.95rem;min-height:1.3em}
</style>
</head>
<body>

<header>
  <h1>Skener EAN kódů</h1>
  <p class="sub">Naskenujte kódy zadním fotoaparátem, pak stáhněte Excel</p>
</header>

<main>
  <p class="notice" id="notice" hidden></p>
  <div class="count"><b id="countNum">0</b><span id="countLabel">naskenovaných kódů</span></div>
  <div id="empty" class="empty">Zatím žádné naskenované kódy.<br>Klepněte dole na „Skenovat“.</div>
  <ul class="rows" id="rows"></ul>
</main>

<div class="toolbar">
  <button type="button" class="btn btn-ghost" id="clearBtn">Vymazat</button>
  <button type="button" class="btn btn-secondary" id="exportBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Excel
  </button>
  <button type="button" class="btn btn-primary" id="scanBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
    Skenovat
  </button>
</div>

<div class="scanner" id="scanner" role="dialog" aria-modal="true" aria-label="Skenování EAN kódu" hidden>
  <div class="scanner-top">
    <span class="scanner-label">Skenování kódu</span>
    <div class="scanner-actions">
      <button type="button" class="scanner-iconbtn" id="scannerTorch" hidden aria-label="Přepnout svítilnu" aria-pressed="false" title="Svítilna">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a6 6 0 0 0-6 6c0 2.2 1.1 3.6 2 4.6.6.7 1 1.3 1 2.4h6c0-1.1.4-1.7 1-2.4.9-1 2-2.4 2-4.6a6 6 0 0 0-6-6Z"/></svg>
      </button>
      <button type="button" class="scanner-iconbtn" id="scannerSwitch" hidden aria-label="Přepnout kameru" title="Přepnout kameru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button type="button" class="scanner-iconbtn" id="scannerClose" aria-label="Zavřít skenování" title="Zavřít">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="scanner-view" id="scannerView"></div>
  <p class="scanner-lastcode" id="scannerLast"></p>
  <p class="scanner-msg" id="scannerMsg"></p>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const el = {
  rows:$('rows'), empty:$('empty'), countNum:$('countNum'), countLabel:$('countLabel'), notice:$('notice'),
  clearBtn:$('clearBtn'), exportBtn:$('exportBtn'), scanBtn:$('scanBtn'),
  scanner:$('scanner'), scannerView:$('scannerView'), scannerMsg:$('scannerMsg'), scannerLast:$('scannerLast'),
  scannerClose:$('scannerClose'), scannerSwitch:$('scannerSwitch'), scannerTorch:$('scannerTorch')
};
const LS_KEY = 'ean-scanner-codes-v1';

let codes = [];
try{ const saved = JSON.parse(localStorage.getItem(LS_KEY)||'[]'); if(Array.isArray(saved)) codes = saved.filter(c=>typeof c==='string'); }catch(e){}

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(codes)); }catch(e){}
}
function showNotice(msg,isError){
  if(!msg){ el.notice.hidden = true; return; }
  el.notice.hidden = false;
  el.notice.textContent = msg;
  el.notice.className = 'notice'+(isError?' error':'');
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function plural(n){ return n===1?'naskenovaný kód':(n>=2&&n<=4?'naskenované kódy':'naskenovaných kódů'); }

function render(){
  el.countNum.textContent = codes.length;
  el.countLabel.textContent = plural(codes.length);
  el.exportBtn.disabled = codes.length===0;
  el.clearBtn.disabled = codes.length===0;
  el.empty.hidden = codes.length>0;
  el.rows.innerHTML = codes.map((c,i)=>
    '<li class="row"><span class="idx">'+(i+1)+'.</span><span class="code">'+esc(c)+'</span>'+
    '<button type="button" class="del" data-i="'+i+'" aria-label="Smazat řádek">&times;</button></li>'
  ).join('');
}
render();

el.rows.addEventListener('click',e=>{
  const btn = e.target.closest('button.del');
  if(!btn) return;
  const i = Number(btn.dataset.i);
  codes.splice(i,1);
  save(); render();
});

el.clearBtn.addEventListener('click',()=>{
  if(!codes.length) return;
  if(!confirm('Opravdu smazat všech '+codes.length+' naskenovaných kódů?')) return;
  codes = []; save(); render(); showNotice('',false);
});

el.exportBtn.addEventListener('click',()=>{
  if(!codes.length) return;
  try{
    const data = [['EAN']].concat(codes.map(c=>[c]));
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{wch:18}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'EAN kódy');
    const d = new Date();
    const pad = n=>String(n).padStart(2,'0');
    const fname = 'EAN_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.xlsx';
    XLSX.writeFile(wb,fname);
    showNotice('Excel soubor "'+fname+'" byl stažen.',false);
  }catch(err){
    showNotice('Export se nepodařil: '+(err&&err.message?err.message:err),true);
  }
});

/* ---------- skenování čárového kódu ---------- */
const SCAN_FORMATS = [9,10,14,15,5,3,8]; // EAN_13, EAN_8, UPC_A, UPC_E, CODE_128, CODE_39, ITF
let scanner = null, scanCameras = [], scanCamIdx = 0, scanTorchOn = false, scanStarting = false, lastCode = '', lastCodeAt = 0;
const hasCameraApi = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function qrboxFn(vw,vh){
  const w = Math.round(Math.min(vw*0.66, Math.max(vh,vw)*0.7));
  const h = Math.max(56,Math.round(Math.min(vh*0.16, w*0.24)));
  return {width:Math.max(180,w),height:h};
}
function scanErrorMsg(err){
  const s = String((err && (err.message||err))||'');
  if(/NotAllowedError|Permission denied|dismissed/i.test(s)) return 'Přístup ke kameře byl zamítnut. Povolte kameru v nastavení prohlížeče a zkuste to znovu.';
  if(/NotFoundError/i.test(s)) return 'Na tomto zařízení nebyla nalezena žádná kamera.';
  if(/NotReadableError/i.test(s)) return 'Kameru se nepodařilo spustit, protože ji používá jiná aplikace.';
  return 'Kameru se nepodařilo spustit. Kód můžete zadat i ručně.';
}
async function startScanner(){
  if(scanStarting) return;
  scanStarting = true;
  el.scanner.hidden = false;
  el.scannerTorch.hidden = true; el.scannerSwitch.hidden = true;
  el.scannerMsg.textContent = 'Spouštím kameru…';
  el.scannerLast.textContent = '';
  try{
    if(!window.Html5Qrcode) throw new Error('Knihovna pro skenování se nenačetla. Zkontrolujte připojení k internetu.');
    if(!scanCameras.length){ try{ scanCameras = await Html5Qrcode.getCameras()||[]; }catch(e){ scanCameras = []; } }
    if(!scanner) scanner = new Html5Qrcode('scannerView',{formatsToSupport:SCAN_FORMATS,verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    const target = scanCameras.length ? {deviceId:{exact:scanCameras[scanCamIdx % scanCameras.length].id}} : {facingMode:'environment'};
    const videoConstraints = Object.assign({width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]},target);
    try{
      await scanner.start(target,{fps:10,qrbox:qrboxFn,videoConstraints},onScanSuccess,()=>{});
    }catch(e){
      await scanner.start(target,{fps:10,qrbox:qrboxFn},onScanSuccess,()=>{});
    }
    el.scannerMsg.textContent = 'Namiřte kameru na čárový kód (cca 10–15 cm od kódu, zarovnejte rovně)';
    el.scannerSwitch.hidden = scanCameras.length<2;
    try{ const caps = scanner.getRunningTrackCapabilities(); el.scannerTorch.hidden = !(caps && caps.torch); }
    catch(e){ el.scannerTorch.hidden = true; }
  }catch(err){
    el.scannerMsg.textContent = scanErrorMsg(err);
  }finally{
    scanStarting = false;
  }
}
async function stopScanner(){
  el.scanner.hidden = true;
  scanTorchOn = false; el.scannerTorch.setAttribute('aria-pressed','false');
  if(scanner){
    try{ if(scanner.isScanning) await scanner.stop(); }catch(e){}
    try{ scanner.clear(); }catch(e){}
  }
}
function onScanSuccess(text){
  const code = String(text||'').trim();
  if(!code) return;
  const now = Date.now();
  // ochrana proti opakovanému načtení stejného kódu z po sobě jdoucích snímků
  if(code===lastCode && (now-lastCodeAt)<1500) return;
  lastCode = code; lastCodeAt = now;
  codes.push(code);
  save(); render();
  el.scannerLast.textContent = 'Přidáno: '+code;
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
}
el.scanBtn.addEventListener('click',startScanner);
el.scannerClose.addEventListener('click',stopScanner);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !el.scanner.hidden) stopScanner(); });
el.scannerSwitch.addEventListener('click',async ()=>{
  if(scanCameras.length<2) return;
  scanCamIdx = (scanCamIdx+1)%scanCameras.length;
  try{ if(scanner && scanner.isScanning) await scanner.stop(); }catch(e){}
  await startScanner();
});
el.scannerTorch.addEventListener('click',async ()=>{
  if(!scanner) return;
  const next = !scanTorchOn;
  try{ await scanner.applyVideoConstraints({advanced:[{torch:next}]}); scanTorchOn = next; el.scannerTorch.setAttribute('aria-pressed',String(next)); }
  catch(e){}
});
window.addEventListener('load',()=>{ if(!hasCameraApi()) el.scanBtn.disabled = true; });
</script>
</body>
</html>
